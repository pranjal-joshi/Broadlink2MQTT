---
name: Broadlink2MQTT
version: "1.0.0"
slug: broadlink2mqtt
description: >-
  Bridge Broadlink RM IR blasters to Home Assistant as native MQTT infrared
  emitter and receiver entities, with a learning-mode switch for capturing codes.
url: https://github.com/pranjal-joshi/Broadlink2MQTT
image: ghcr.io/pranjal-joshi/{arch}-broadlink2mqtt
# cryptography (a hard dependency of python-broadlink) only publishes musl
# wheels for aarch64 and x86_64; other architectures would need a Rust
# toolchain to build it from source.
arch:
  - aarch64
  - amd64
init: false
# Broadlink discovery is a UDP broadcast to 255.255.255.255:80, which does not
# cross the add-on's bridge network.
host_network: true
services:
  - mqtt:want
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_ssl: false
  base_topic: broadlink2mqtt
  discovery_prefix: homeassistant
  auto_discover: true
  discovery_timeout: 5
  devices: []
  capture_window: 15
  capture_limit: 60
  poll_interval: 1
  rearm_interval: 20
  publish_sensors: true
  log_level: info
schema:
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ssl: bool
  base_topic: str
  discovery_prefix: str
  auto_discover: bool
  discovery_timeout: int(1,60)
  devices:
    - host: str
      mac: str?
      name: str?
  capture_window: int(5,300)
  capture_limit: int(5,900)
  poll_interval: float(0.2,10)
  rearm_interval: int(5,30)
  publish_sensors: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)
