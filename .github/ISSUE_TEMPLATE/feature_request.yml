name: Feature request
description: Suggest an idea for this add-on
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are trying to handle today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand RF (315/433 MHz) is out of scope — Home Assistant's infrared entities are IR only
          required: false
