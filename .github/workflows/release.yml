name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A tag carrying a pre-release suffix (v1.1.0-beta.1) publishes as a
          # GitHub pre-release, so it never becomes the "latest" download.
          case "${VERSION}" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Version ${VERSION}"

      - name: Check the tag matches the add-on version
        run: |
          ADDON_VERSION=$(grep '^version:' broadlink2mqtt/config.yaml | cut -d'"' -f2)
          if [ "${ADDON_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.version }} does not match broadlink2mqtt/config.yaml version ${ADDON_VERSION}"
            exit 1
          fi
          echo "Version ${ADDON_VERSION} matches the tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: broadlink2mqtt/CHANGELOG.md
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}

# The container images are built by builder.yml, which triggers on the same tag
# push and runs alongside this workflow.
